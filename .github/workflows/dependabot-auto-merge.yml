name: Dependabot auto-merge

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Merge minor and patch updates after CI
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      - name: Wait for CI and squash merge
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          run_id=""
          for _ in {1..30}; do
            run_id="$(gh run list --workflow CI --commit "${HEAD_SHA}" --event pull_request --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "${run_id}" ]]; then
              break
            fi
            sleep 10
          done

          if [[ -z "${run_id}" ]]; then
            echo "CI run was not found for ${HEAD_SHA}." >&2
            exit 1
          fi

          gh run watch "${run_id}" --exit-status
          gh pr merge "${PR_URL}" --squash --delete-branch --match-head-commit "${HEAD_SHA}"
